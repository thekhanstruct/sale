<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Clean</title>
    <meta name="description" content="Premium household items and decor at a 40% discount. Automated IKEA inventory.">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>


<body>
    <div class="marketplace-layout">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                Spring Clean
            </div>
            <button class="btn-secondary" id="header-saved-btn" onclick="toggleSavedTab(!isSavedTab)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                <span id="saved-text">Saved</span>
            </button>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Controls Row -->
            <div class="controls-row">
                <div class="search-input-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" placeholder="Search local finds..." onkeyup="renderInventory()">
                </div>
                <div class="search-actions">
                    <button class="btn-secondary" id="clear-btn" onclick="clearFilters()" style="display: none; color: var(--accent-color); border-color: var(--border-color);">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        Clear Filters
                    </button>
                    <button class="btn-secondary sort-btn" id="sort-btn" onclick="togglePriceSort()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="14" y2="12"></line><line x1="4" y1="18" x2="8" y2="18"></line></svg> 
                        <span id="sort-text">Sort: Price</span>
                    </button>
                    <button class="btn-secondary filter-btn" id="filter-btn" title="Filters">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                        <span id="filter-text">Filtered (0)</span>
                    </button>
                </div>
            </div>

            <!-- Category Chips -->
            <div class="category-chips" id="category-chips">
                <button class="chip active" data-category="All" onclick="setCategory('All')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    All
                </button>
                <button class="chip" data-category="Storage" onclick="setCategory('Storage')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    Storage
                </button>
                <button class="chip" data-category="Acrylic" onclick="setCategory('Acrylic')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 2 18 2 22 8 12 22 2 8"></polygon></svg>
                    Acrylic
                </button>
                <button class="chip" data-category="Shelves" onclick="setCategory('Shelves')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    Shelves
                </button>
                <button class="chip" data-category="Kitchen" onclick="setCategory('Kitchen')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
                    Kitchen
                </button>
                <button class="chip" data-category="Decor" onclick="setCategory('Decor')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4-4 4-10 0-14-4 4-4 10 0 14z"></path></svg>
                    Decor
                </button>
                <button class="chip" data-category="Collectibles" onclick="setCategory('Collectibles')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    Collectibles
                </button>
                <button class="chip" data-category="Home" onclick="setCategory('Home')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Home
                </button>
            </div>
            
            <!-- Authentic Retailer Vector Logos -->
            <div class="retailer-row">
                <span style="font-size: 0.8rem; color: var(--text-secondary); margin-right: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Retailer</span>
                <div class="retailer-logos">
                    <button class="retailer-logo-btn" data-retailer="Michaels" onclick="setRetailer('Michaels')" title="Michaels">
                        <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#E21836"/><text x="50" y="22" font-family="'Georgia', serif" font-weight="900" font-style="italic" font-size="16" fill="#FFFFFF" text-anchor="middle">Michaels</text></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="Five Below" onclick="setRetailer('Five Below')" title="Five Below">
                        <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#0077C8"/><text x="50" y="14" font-family="'Impact', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">five</text><text x="50" y="27" font-family="'Impact', sans-serif" font-size="13" fill="#FFC72C" text-anchor="middle" letter-spacing="1">BELOW</text></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="Big Lots" onclick="setRetailer('Big Lots')" title="Big Lots">
                        <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#F47321"/><text x="38" y="22" font-family="'Impact', sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">BIG</text><text x="68" y="22" font-family="'Impact', sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">LOTS</text><text x="84" y="22" font-family="'Impact', sans-serif" font-size="17" fill="#FFFFFF" font-weight="bold">!</text></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="Target" onclick="setRetailer('Target')" title="Target">
                        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="15" fill="#CC0000"/><circle cx="16" cy="16" r="10" fill="#FFFFFF"/><circle cx="16" cy="16" r="5" fill="#CC0000"/></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="IKEA" onclick="setRetailer('IKEA')" title="IKEA">
                        <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#0058A8"/><ellipse cx="50" cy="16" rx="44" ry="13" fill="#FFDA1A"/><text x="50" y="22" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="17" fill="#0058A8" text-anchor="middle" letter-spacing="1">IKEA</text></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="The Container Store" onclick="setRetailer('The Container Store')" title="The Container Store">
                        <svg viewBox="0 0 110 32" xmlns="http://www.w3.org/2000/svg"><rect width="110" height="32" rx="6" fill="#0D2538"/><text x="55" y="12" font-family="system-ui, sans-serif" font-weight="700" font-size="7" fill="#88A0B8" text-anchor="middle" letter-spacing="1">THE</text><text x="55" y="21" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#00C389" text-anchor="middle" letter-spacing="1">CONTAINER</text><text x="55" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="6.5" fill="#88A0B8" text-anchor="middle" letter-spacing="1.5">STORE</text></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="HomeGoods" onclick="setRetailer('HomeGoods')" title="HomeGoods">
                        <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#BF1522"/><text x="50" y="21" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">HomeGoods</text></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="Amazon" onclick="setRetailer('Amazon')" title="Amazon">
                        <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#131921"/><text x="50" y="19" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">amazon</text><path d="M28 23 Q 50 28 72 23" stroke="#FF9900" stroke-width="2" fill="none" stroke-linecap="round"/><polygon points="70,21 74,23 71,25" fill="#FF9900"/></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="Walmart" onclick="setRetailer('Walmart')" title="Walmart">
                        <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#0071DC"/><text x="42" y="21" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle">Walmart</text><circle cx="77" cy="16" r="2.5" fill="#FFC220"/><line x1="77" y1="10" x2="77" y2="12" stroke="#FFC220" stroke-width="2" stroke-linecap="round"/><line x1="77" y1="20" x2="77" y2="22" stroke="#FFC220" stroke-width="2" stroke-linecap="round"/><line x1="71" y1="13" x2="73" y2="14.5" stroke="#FFC220" stroke-width="2" stroke-linecap="round"/><line x1="81" y1="17.5" x2="83" y2="19" stroke="#FFC220" stroke-width="2" stroke-linecap="round"/><line x1="71" y1="19" x2="73" y2="17.5" stroke="#FFC220" stroke-width="2" stroke-linecap="round"/><line x1="81" y1="14.5" x2="83" y2="13" stroke="#FFC220" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="Wayfair" onclick="setRetailer('Wayfair')" title="Wayfair">
                        <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#7B2C88"/><text x="50" y="21" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">wayfair</text></svg>
                    </button>
                    <button class="retailer-logo-btn" data-retailer="At Home" onclick="setRetailer('At Home')" title="At Home">
                        <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#FF5E00"/><text x="50" y="21" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle">at home</text></svg>
                    </button>
                </div>
            </div>

            <!-- Empty State -->
            <div id="saved-empty-state" class="force-hide" style="padding:4rem; text-align:center; color:var(--text-secondary);">
                <div style="margin-bottom:1rem; opacity:0.5;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </div>
                <h2 style="color:var(--text-primary); margin-bottom:0.5rem;">No saved items</h2>
                <p>You haven't saved any items yet.</p>
                <button class="btn-secondary" style="margin-top:1.5rem;" onclick="toggleSavedTab(false)">Explore Marketplace</button>
            </div>

            <!-- Inventory Grid -->
            <div class="inventory-grid" id="inventory-container">
                <div class="loader">Loading inventory...</div>
            </div>
        </main>
    </div>

<script>


        
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQgNwntMBcyGi-5hplX9GiCBR4eKPvQiHTPE8R27_9awMk2bJpqOucyN3ZcQIkJLW13V9aJl61nkVSa/pub?output=csv';
        let inventory = [];
        let selectedItem = null;
        
        // NEW STATE
        let searchQuery = "";
        let selectedCategory = "All";
        let expandedItemId = null;
        let isSavedTab = false;
        let priceSort = null;
        let selectedRetailer = "All";
        let savedItemIds = JSON.parse(localStorage.getItem('savedItemIds') || '[]');
        
        const retailerDomains = {
          'thecontainerstore.com': 'The Container Store',
          'ikea.com': 'IKEA',
          'target.com': 'Target',
          'amazon.com': 'Amazon',
          'walmart.com': 'Walmart',
          'homedepot.com': 'The Home Depot',
          'lowes.com': "Lowe's",
          'wayfair.com': 'Wayfair',
          'crateandbarrel.com': 'Crate & Barrel',
          'getopenspaces.com': 'Open Spaces',
          'athome.com': 'At Home',
          'michaels.com': 'Michaels',
          'fivebelow.com': 'Five Below',
          'biglots.com': 'Big Lots',
          'homegoods.com': 'HomeGoods'
        };

        function inferRetailer(link) {
            if (!link || link === '#') return 'Other';
            for (const [domain, name] of Object.entries(retailerDomains)) {
                if (link.toLowerCase().includes(domain)) return name;
            }
            return 'Other';
        }

        function setRetailer(retailer) {
            selectedRetailer = selectedRetailer === retailer ? "All" : retailer;
            document.querySelectorAll('.retailer-logo-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.retailer === selectedRetailer);
            });
            renderInventory();
        }

        
        function togglePriceSort() {
            if (priceSort === null) priceSort = 'asc';
            else if (priceSort === 'asc') priceSort = 'desc';
            else priceSort = null;
            
            let btn = document.getElementById('sort-btn');
            let sortText = document.getElementById('sort-text');
            if (priceSort === 'asc') sortText.innerText = 'Low to High';
            else if (priceSort === 'desc') sortText.innerText = 'High to Low';
            else sortText.innerText = 'Sort: Price';
            btn.classList.toggle('active', priceSort !== null);
            renderInventory();
        }
        
        function toggleSavedTab(state) {
            isSavedTab = state;
            let headerBtn = document.getElementById('header-saved-btn');
            headerBtn.classList.toggle('active', state);
            document.getElementById('saved-text').innerText = state ? 'Back to Store' : 'Saved';
            renderInventory();
        }

        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.chip').forEach(c => {
                c.classList.toggle('active', c.getAttribute('data-category') === cat);
            });
            renderInventory();
        }

        function clearFilters() {
            document.getElementById('search-input').value = "";
            selectedCategory = "All";
            selectedRetailer = "All";
            document.querySelectorAll('.chip').forEach(c => {
                c.classList.toggle('active', c.getAttribute('data-category') === 'All');
            });
            document.querySelectorAll('.retailer-logo-btn').forEach(btn => btn.classList.remove('active'));
            priceSort = null;
            let sortBtn = document.getElementById('sort-btn');
            if (sortBtn) sortBtn.classList.remove('active');
            let sortText = document.getElementById('sort-text');
            if (sortText) sortText.innerText = 'Sort: Price';
            renderInventory();
        }

        function toggleItem(id) {
            expandedItemId = (expandedItemId === id) ? null : id;
            renderInventory();
        }

        function toggleSaved(id, event) {
            if (event) event.stopPropagation();
            if (savedItemIds.includes(id)) {
                savedItemIds = savedItemIds.filter(i => i !== id);
            } else {
                savedItemIds.push(id);
            }
            localStorage.setItem('savedItemIds', JSON.stringify(savedItemIds));
            renderInventory();
        }

        // Authentic Vector Retailer SVG Logos
        function getRetailerLogoSvg(retailer) {
            switch (retailer) {
                case 'Michaels':
                    return `<svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#E21836"/><text x="50" y="22" font-family="'Georgia', serif" font-weight="900" font-style="italic" font-size="16" fill="#FFFFFF" text-anchor="middle">Michaels</text></svg>`;
                case 'Five Below':
                    return `<svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#0077C8"/><text x="50" y="14" font-family="'Impact', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">five</text><text x="50" y="27" font-family="'Impact', sans-serif" font-size="13" fill="#FFC72C" text-anchor="middle" letter-spacing="1">BELOW</text></svg>`;
                case 'Big Lots':
                    return `<svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#F47321"/><text x="38" y="22" font-family="'Impact', sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">BIG</text><text x="68" y="22" font-family="'Impact', sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">LOTS</text><text x="84" y="22" font-family="'Impact', sans-serif" font-size="17" fill="#FFFFFF" font-weight="bold">!</text></svg>`;
                case 'Target':
                    return `<svg viewBox="0 0 80 32" xmlns="http://www.w3.org/2000/svg"><rect width="80" height="32" rx="6" fill="#CC0000"/><circle cx="22" cy="16" r="10" fill="#FFFFFF"/><circle cx="22" cy="16" r="6" fill="#CC0000"/><circle cx="22" cy="16" r="3" fill="#FFFFFF"/><text x="54" y="21" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TARGET</text></svg>`;
                case 'IKEA':
                    return `<svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#0058A8"/><ellipse cx="50" cy="16" rx="44" ry="13" fill="#FFDA1A"/><text x="50" y="22" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="17" fill="#0058A8" text-anchor="middle" letter-spacing="1">IKEA</text></svg>`;
                case 'The Container Store':
                    return `<svg viewBox="0 0 110 32" xmlns="http://www.w3.org/2000/svg"><rect width="110" height="32" rx="6" fill="#0D2538"/><text x="55" y="12" font-family="system-ui, sans-serif" font-weight="700" font-size="7" fill="#88A0B8" text-anchor="middle" letter-spacing="1">THE</text><text x="55" y="21" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#00C389" text-anchor="middle" letter-spacing="1">CONTAINER</text><text x="55" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="6.5" fill="#88A0B8" text-anchor="middle" letter-spacing="1.5">STORE</text></svg>`;
                case 'HomeGoods':
                    return `<svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="32" rx="6" fill="#BF1522"/><text x="50" y="21" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">HomeGoods</text></svg>`;
                case 'Amazon':

            };

            // Robust CSV parser
            const parseCSV = (text) => {
                const rows = [];
                let currentRow = [];
                let currentCell = '';
                let inQuotes = false;
                
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const nextChar = text[i + 1];
                    
                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            currentCell += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        currentRow.push(currentCell.trim());
                        currentCell = '';
                    } else if ((char === '\r' || char === '\n') && !inQuotes) {
                        if (currentRow.length > 0 || currentCell !== '') {
                            currentRow.push(currentCell.trim());
                            rows.push(currentRow);
                            currentRow = [];
                            currentCell = '';
                        }
                        if (char === '\r' && nextChar === '\n') i++;
                    } else {
                        currentCell += char;
                    }
                }
                if (currentRow.length > 0 || currentCell !== '') {
                    currentRow.push(currentCell.trim());
                    rows.push(currentRow);
                }
                return rows;
            };

            const allRows = parseCSV(data);
            const dataRows = allRows.slice(1); // Skip header

            inventory = dataRows.map((cols, index) => {
                let name = cols[0];
                if (!name || name.trim() === '' || name.toLowerCase().includes('test product')) return null;
                
                let subname = cols[1] || '';
                let price = parseFloat((cols[2] || '0').replace(/[^0-9.]/g, '')) || 0;
                let condition = cols[3]?.trim() || 'Like New';
                let rawOriginalPrice = cols[4] || '';
                let status = cols[5]?.trim() || 'Available';
                let size = cols[6] || '';
                let dimensions = cols[7] || '';
                let height = cols[8] || '';
                let qty = cols[9] || '1';
                let rawLink = (cols[10] || '').trim();

                // 1. Authoritative Verified Image (Matches Physical Box Tags)
                let verifiedImg = getVerifiedImage(name, subname, dimensions, size);
                let rawImg1 = verifiedImg || cols[11]?.trim() || 'images/IMG_8167.jpeg';
                if (!rawImg1.startsWith('http') && !rawImg1.startsWith('images/')) {
                    rawImg1 = 'images/' + rawImg1;
                }
                rawImg1 = rawImg1.replace(/\.(HEIC|HEIF|PNG|png)$/i, '.jpeg');

                // 2. Authoritative Verified Retailer Link & Original Price
                let finalLink = getVerifiedRetailerUrl(name, subname, dimensions, rawLink);
                let finalOriginal = getVerifiedOriginalPrice(name, subname, dimensions, rawOriginalPrice);
                let retailer = inferRetailer(finalLink, name);

                // 3. Full Name and Categories
                let fullName = subname && subname !== 'N/A' && subname !== '' ? `${name} - ${subname}` : name;
                let scraped = scrapedData[finalLink] || {};
                let desc = scraped.description || `Authentic ${retailer !== 'Other' ? retailer + ' ' : ''}garage sale item in ${condition.toLowerCase()} condition. Pet-free, smoke-free home.`;
                
                let categories = inferCategories(fullName, desc, dimensions);
                let primaryCategory = categories.find(c => c !== 'Home') || categories[0] || 'Home';

                return {
                    id: `item-${index}`,
                    name: fullName,
                    rawName: name,
                    category: primaryCategory,
                    categories: categories,
                    retailer: retailer,
                    price: price,
                    status: status,
                    size: size,
                    dimensions: dimensions,
                    height: height,
                    qty: qty,
                    originalPrice: finalOriginal,
                    link: finalLink,
                    desc: desc,
                    condition: condition,
                    rawImg1: rawImg1
                };
            }).filter(item => item !== null && item.name !== 'Unknown Item' && item.name !== '');

            renderInventory();
        }

        function renderInventory() {
            searchQuery = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = inventory.filter(item => {
                const text = `${item.name} ${item.categories.join(' ')} ${item.condition} ${item.desc} ${item.retailer}`.toLowerCase();
                const matchesSearch = text.includes(searchQuery);
                const matchesCategory = (selectedCategory === "All" || item.categories.includes(selectedCategory));
                const matchesSavedTab = !isSavedTab || savedItemIds.includes(item.id);
                const matchesRetailer = (selectedRetailer === "All" || item.retailer === selectedRetailer);
                return matchesSearch && matchesCategory && matchesSavedTab && matchesRetailer;
            });
            
            if (priceSort === 'asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (priceSort === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            }

            // Update filters count UI
            let activeFilters = 0;
            if (searchQuery !== "") activeFilters++;
            if (selectedCategory !== "All") activeFilters++;
            if (selectedRetailer !== "All") activeFilters++;
            
            let filterBtn = document.getElementById('filter-btn');
            if (filterBtn) {
                document.getElementById('filter-text').innerText = activeFilters > 0 ? `Filtered (${activeFilters})` : 'Filtered (0)';
                filterBtn.classList.toggle('active', activeFilters > 0);
            }
            
            let clearBtn = document.getElementById('clear-btn');
            if (clearBtn) {
                clearBtn.style.display = activeFilters > 0 ? 'flex' : 'none';
            }
            
            const container = document.getElementById('inventory-container');
            const emptyState = document.getElementById('saved-empty-state');
            
            if (isSavedTab && filtered.length === 0) {
                container.style.display = 'none';
                emptyState.classList.remove('force-hide');
                return;
            } else {
                container.style.display = 'grid';
                emptyState.classList.add('force-hide');
                
                if (filtered.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 3rem;">No items found matching your filters.</div>';
                    return;
                }
            }

            container.innerHTML = filtered.map((item, index) => {
                const isExpanded = expandedItemId === item.id;
                const isSaved = savedItemIds.includes(item.id);
                
                // Calculate discount and savings
                let origVal = 0;
                let origFormatted = '';
                if (item.originalPrice && item.originalPrice !== 'N/A') {
                    origVal = parseFloat(item.originalPrice.replace(/[^0-9.]/g, '')) || 0;
                    if (origVal > 0) origFormatted = `$${origVal.toFixed(2)}`;
                }
                
                let discountPercent = 0;
                let savingsText = '';
                if (origVal > item.price && origVal > 0) {
                    discountPercent = Math.round((1 - (item.price / origVal)) * 100);
                    const savedAmount = (origVal - item.price).toFixed(2);
                    savingsText = `${discountPercent}% OFF (Save $${savedAmount})`;
                }
                
                let qtyBadgeText = '';
                if (item.status === 'Sold') {
                    qtyBadgeText = 'SOLD';
                } else if (item.qty && parseInt(item.qty) > 1) {
                    qtyBadgeText = `${item.qty} in stock`;
                } else {
                    qtyBadgeText = '1 available';
                }
                
                const hasRetailerLink = item.link && item.link !== '#' && !item.link.startsWith('javascript');

                return `
                <div class="item-card ${isExpanded ? 'expanded' : ''}" style="animation-delay: ${index * 0.03}s">
                    <div class="card-image-wrap" onclick="toggleItem('${item.id}')">
                        ${discountPercent > 0 ? `<div class="card-badge-discount">${discountPercent}% OFF</div>` : ''}
                        <div class="card-badge-qty" style="${item.status === 'Sold' ? 'background: #dc2626; color: white;' : ''}">${qtyBadgeText}</div>
                        <img src="${item.rawImg1}" alt="${item.name}" class="item-img" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/600x600/111/444?text=Garage+Sale+Item'">
                    </div>
                    
                    <div class="card-content">
                        <div class="card-header" onclick="toggleItem('${item.id}')">
                            <div class="card-header-top">
                                <span class="item-category">${item.category}</span>
                                <span class="condition-badge">${item.condition}</span>
                            </div>
                            <h3 class="item-title">${item.name}</h3>
                            <div class="item-specs-preview">${item.dimensions && item.dimensions !== 'N/A' ? item.dimensions : (item.size && item.size !== 'N/A' ? item.size : '')}</div>
                        </div>

                        <div class="card-pricing-block">
                            <div class="price-main-wrap">
                                <span class="price-current">$${item.price.toFixed(2)}</span>
                                ${origFormatted ? `<span class="price-original">${origFormatted}</span>` : ''}
                            </div>
                            ${savingsText ? `<span class="savings-pill">${savingsText}</span>` : ''}
                        </div>

                        ${hasRetailerLink ? `
                        <div class="retailer-compare-row">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="retailer-compare-btn" title="Compare price at ${item.retailer}">
                                <span class="compare-text">Compare Price</span>
                                <div class="compare-logo-wrap">${getRetailerLogoSvg(item.retailer)}</div>
                                <svg class="compare-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l9.2-9.2M17 17V8H8"/></svg>
                            </a>
                        </div>` : ''}

                        <div class="card-actions-row">
                            <button class="btn-card-save ${isSaved ? 'saved' : ''}" onclick="toggleSaved('${item.id}', event)">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="${isSaved ? '#ef4444' : 'none'}" stroke="${isSaved ? '#ef4444' : 'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <span>${isSaved ? 'Saved' : 'Save'}</span>
                            </button>
                            <button class="btn-card-expand" onclick="toggleItem('${item.id}')">
                                <span>${isExpanded ? 'Hide Details' : 'View Details'}</span>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="${isExpanded ? '18 15 12 9 6 15' : '6 9 12 15 18 9'}"></polyline></svg>
                            </button>
                        </div>
                        
                        ${isExpanded ? `
                        <div class="card-expanded-content">
                            <p class="item-desc">${item.desc}</p>
                            
                            <div class="specs-grid">
                                <div class="spec-box">
                                    <label>DIMENSIONS</label>
                                    <span>${item.dimensions && item.dimensions !== 'N/A' ? item.dimensions : (item.size && item.size !== 'N/A' ? item.size : 'Standard')}</span>
                                </div>
                                <div class="spec-box">
                                    <label>CONDITION</label>
                                    <span>${item.condition}</span>
                                </div>
                                <div class="spec-box">
                                    <label>RETAILER</label>
                                    <span>${item.retailer}</span>
                                </div>
                                <div class="spec-box">
                                    <label>STATUS</label>
                                    <span style="color: ${item.status === 'Available' ? '#10b981' : '#ff4444'}">● ${item.status}</span>
                                </div>
                            </div>
                            
                            <div class="expanded-buttons">
                                <button class="btn-primary" onclick="openBuyModal('${item.id}')" ${item.status !== 'Available' ? 'disabled' : ''}>
                                    ${item.status === 'Available' ? `Buy Now - $${item.price.toFixed(2)}` : 'Item Sold'}
                                </button>
                                <button class="btn-secondary" onclick="window.open('sms:8323821675?body=Hi%2C%20I%20have%20a%20question%20about%20the%20${encodeURIComponent(item.name)}')">
                                    Message Seller
                                </button>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                </div>
                `;
            }).join('');
        }

        }

        function openBuyModal(id) {
            selectedItem = inventory.find(i => i.id === id);
            if (!selectedItem) return;
            
            const modal = document.getElementById('buy-modal');
            document.getElementById('modal-item-name').innerText = selectedItem.name;
            document.getElementById('modal-stage-1').classList.remove('force-hide');
            document.getElementById('modal-stage-2').classList.add('force-hide');
            const stage3 = document.getElementById('modal-stage-3');
            if(stage3) stage3.classList.add('force-hide');
            
            modal.classList.remove('force-hide');
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('buy-modal');
            modal.classList.add('force-hide');
            modal.style.display = 'none';
            selectedItem = null;
            document.getElementById('buyer-phone').value = '';
            document.getElementById('phone-error').style.display = "none";
            document.getElementById('buyer-phone').style.border = "1px solid var(--glass-border)";
        }

        function goToStage2() {
            const phoneInput = document.getElementById('buyer-phone');
            const errorMsg = document.getElementById('phone-error');
            const phone = phoneInput.value.trim();

            if (!phone) {
                phoneInput.style.border = "2px solid #ff4444";
                errorMsg.style.display = "block";
                return;
            }
            phoneInput.style.border = "1px solid var(--glass-border)";
            errorMsg.style.display = "none";

            document.getElementById('modal-stage-1').classList.add('force-hide');
            document.getElementById('modal-stage-2').classList.remove('force-hide');
        }

        function processPayment(method) {
            if (!selectedItem) {
                closeModal();
                return;
            }

            const phone = document.getElementById('buyer-phone').value.trim();
            const note = encodeURIComponent(`Spring Clean: ${selectedItem.name} - ${phone}`);
            
            // Instantly send an email backup to Zain so he always has their phone number
            fetch("https://formsubmit.co/ajax/zain@thekhanstruct.com", {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    _subject: `New Spring Clean Order: ${selectedItem.name}`,
                    Item: selectedItem.name,
                    Buyer_Phone: phone,
                    Payment_Method: method,
                    _captcha: "false",
                    _template: "table"
                })
            }).catch(e => console.log(e));
            
            // Switch Modal UI Stages
            document.getElementById('modal-stage-2').classList.add('force-hide');
            document.getElementById('modal-stage-3').classList.remove('force-hide');
            
            const instructionBox = document.getElementById('instruction-content');

            if (method === 'venmo') {
                const venmoUrl = `https://venmo.com/u/Zainer23?txn=pay&amount=${selectedItem.price}&note=${note}`;
                instructionBox.innerHTML = `
                    <div class="instruction-step"><div class="step-num">1</div><div>We are redirecting you to Venmo...</div></div>
                    <div class="instruction-step"><div class="step-num">2</div><div>Pay <b>$${selectedItem.price}</b> to <b>@Zainer23</b>.</div></div>
                    <div class="instruction-step" style="margin-top:1rem; font-size:0.85rem;"><a href="${venmoUrl}" target="_blank" style="color:#008CFF">Click here if Venmo didn't open automatically</a></div>
                `;
                setTimeout(() => { window.open(venmoUrl, '_blank'); }, 500);
            } else if (method === 'cashapp') {
                const cashappUrl = `https://cash.app/$z23k/${selectedItem.price}`;
                instructionBox.innerHTML = `
                    <div class="instruction-step"><div class="step-num">1</div><div>We are redirecting you to Cash App...</div></div>
                    <div class="instruction-step"><div class="step-num">2</div><div>Pay <b>$${selectedItem.price}</b> to <b>$z23k</b>.</div></div>
                    <div class="instruction-step"><div class="step-num">3</div><div><b style="color:#00D632">IMPORTANT:</b> Type your phone number (<b>${phone}</b>) in the 'For' note!</div></div>
                    <div class="instruction-step" style="margin-top:1rem; font-size:0.85rem;"><a href="${cashappUrl}" target="_blank" style="color:#00D632">Click here if Cash App didn't open automatically</a></div>
                `;
                setTimeout(() => { window.open(cashappUrl, '_blank'); }, 500);
            } else if (method === 'zelle') {
                instructionBox.innerHTML = `
                    <div style="text-align:center; margin-bottom: 1.5rem;"><img src="images/zelle.svg" style="height:24px; filter: brightness(0) invert(1);"></div>
                    <div class="instruction-step"><div class="step-num">1</div><div>Open your bank's app and navigate to Zelle.</div></div>
                    <div class="instruction-step"><div class="step-num">2</div><div>Send <b>$${selectedItem.price}</b> to <b>ZAIN KHAN</b>.</div></div>
                    <div class="instruction-step"><div class="step-num">3</div><div><b style="color:#a855f7">IMPORTANT:</b> Type your phone number (<b>${phone}</b>) in the Zelle memo!</div></div>
                `;
            }
        }

        fetchInventory();
    

</script>
</body>
</html>
