<!DOCTYPE html>

                    <button class="retailer-logo-btn" data-retailer="Amazon" onclick="setRetailer('Amazon')" title="Amazon">

                    <button class="retailer-logo-btn" data-retailer="Walmart" onclick="setRetailer('Walmart')" title="Walmart">

            <!-- Inventory Grid -->

<script>


        
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQgNwntMBcyGi-5hplX9GiCBR4eKPvQiHTPE8R27_9awMk2bJpqOucyN3ZcQIkJLW13V9aJl61nkVSa/pub?output=csv';
        let inventory = [];
        let selectedItem = null;
        
        // NEW STATE
        let searchQuery = "";
        let selectedCategory = "All";
        let expandedItemId = null;
        let isSavedTab = false;
        let priceSort = null;
        let selectedRetailer = "All";
        let savedItemIds = JSON.parse(localStorage.getItem('savedItemIds') || '[]');
        
        const retailerDomains = {
          'thecontainerstore.com': 'The Container Store',
          'ikea.com': 'IKEA',
          'target.com': 'Target',
          'amazon.com': 'Amazon',
          'walmart.com': 'Walmart',
          'homedepot.com': 'The Home Depot',
          'lowes.com': "Lowe's",
          'wayfair.com': 'Wayfair',
          'crateandbarrel.com': 'Crate & Barrel',
          'getopenspaces.com': 'Open Spaces',
          'athome.com': 'At Home',
          'michaels.com': 'Michaels',
          'fivebelow.com': 'Five Below',
          'biglots.com': 'Big Lots',
          'homegoods.com': 'HomeGoods'
        };

        function inferRetailer(link) {
            if (!link || link === '#') return 'Other';
            for (const [domain, name] of Object.entries(retailerDomains)) {
                if (link.toLowerCase().includes(domain)) return name;
            }
            return 'Other';
        }

        function setRetailer(retailer) {
            selectedRetailer = selectedRetailer === retailer ? "All" : retailer;
            document.querySelectorAll('.retailer-logo-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.retailer === selectedRetailer);
            });
            renderInventory();
        }

        
        function togglePriceSort() {
            if (priceSort === null) priceSort = 'asc';
            else if (priceSort === 'asc') priceSort = 'desc';
            else priceSort = null;
            
            let btn = document.getElementById('sort-btn');
            let sortText = document.getElementById('sort-text');
            if (priceSort === 'asc') sortText.innerText = 'Low to High';
            else if (priceSort === 'desc') sortText.innerText = 'High to Low';
            else sortText.innerText = 'Sort: Price';
            btn.classList.toggle('active', priceSort !== null);
            renderInventory();
        }
        
        function toggleSavedTab(state) {
            isSavedTab = state;
            let headerBtn = document.getElementById('header-saved-btn');
            headerBtn.classList.toggle('active', state);
            document.getElementById('saved-text').innerText = state ? 'Back to Store' : 'Saved';
            renderInventory();
        }

        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.chip').forEach(c => {
                c.classList.toggle('active', c.innerText === cat);
            });
            renderInventory();
        }

        function clearFilters() {
            document.getElementById('search-input').value = "";
            selectedCategory = "All";
            selectedRetailer = "All";
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.innerText.trim() === 'All'));
            document.querySelectorAll('.retailer-logo-btn').forEach(btn => btn.classList.remove('active'));
            priceSort = null;
            let sortBtn = document.getElementById('sort-btn');
            sortBtn.classList.remove('active');
            document.getElementById('sort-text').innerText = 'Sort: Price';
            renderInventory();
        }

        function toggleItem(id) {
            expandedItemId = (expandedItemId === id) ? null : id;
            renderInventory();
        }

        function toggleSaved(id, event) {
            event.stopPropagation();
            if (savedItemIds.includes(id)) {
                savedItemIds = savedItemIds.filter(i => i !== id);
            } else {
                savedItemIds.push(id);
            }
            localStorage.setItem('savedItemIds', JSON.stringify(savedItemIds));
            renderInventory();
        }
        
        function inferCategory(name, desc) {
            const text = (name + " " + desc).toLowerCase();
            if(text.match(/headphones|cable|lamp|tech|electronic|charger/)) return "Electronics";
            if(text.match(/mixer|coffee|kitchen|tray|dinnerware/)) return "Kitchen";
            if(text.match(/clothing|backpack|fashion|wear/)) return "Fashion";
            if(text.match(/vintage|collectible|art/)) return "Collectibles";
            return "Home";
        }


        async function fetchInventory() {
            try {
                // Add a cache-busting query parameter so the browser always fetches the latest Google Sheet changes
                const response = await fetch(SHEET_CSV_URL + '&_t=' + new Date().getTime());
                let data = await response.text();
                
                // Inject Test Product for User Verification
                data += '\nTest Product,Verification Item,$1.00,Brand New,$5.00,Available,Test Size,10"x10",10",1,https://example.com,https://placehold.co/600x600/111/444?text=Test+Product,,,,';
                // Embed Scraped Link Data
                const scrapedData = {
                  "https://www.target.com/p/standard-ironing-board-cover-gray-room-essentials-8482/-/A-87215417#lnk=sametab": {
                    "image": "images/stock_ironing_board.jpeg",
                    "description": "Standard Ironing Board Cover Gray - Room Essentials"
                  },
                  "https://hamiltonbeach.com/10-cup-food-processor-70730": {
                    "image": "https://hamiltonbeach.com/media/hamilton_beach_social.jpg",
                    "description": "10-Cup Food Processor with Bowl Scraper | Hamilton Beach"
                  },
                  "https://www.ikea.com/us/en/p/uppdatera-flatware-tray-light-bamboo-20491356/": {
                    "image": "https://www.ikea.com/us/en/images/products/uppdatera-flatware-tray-light-bamboo__0968836_pe810562_s5.jpg",
                    "description": "UPPDATERA flatware tray, light bamboo. Stay organized while the bamboo adds a warm, natural feel."
                  },
                  "https://www.ikea.com/us/en/p/visslaan-drawer-organizers-set-of-3-gray-20562117/": {

                    "description": "VISSLA\u00c5N drawer organizers, set of 3. Ideal for holding toothbrushes and items nearby."
                  },
                  "https://www.ikea.com/us/en/p/fejka-artificial-potted-plant-indoor-outdoor-hanging-eucalyptus-00615249/": {
                    "image": "https://www.ikea.com/us/en/images/products/fejka-artificial-potted-plant-indoor-outdoor-hanging-eucalyptus__0817871_pe774216_s5.jpg",
                    "description": "FEJKA artificial potted plant. Doesn\u2019t require a green thumb to spruce up at home."
                  },
                  "https://www.ikea.com/us/en/p/montera-cable-management-white-30147425/": {
                    "image": "https://www.ikea.com/us/en/images/products/montera-cable-management-white__0088067_pe218108_s5.jpg",
                    "description": "MONTERA cable management, white. A simple solution to hide cables and fix to the skirting-board, neat and tidy."
                  },
                  "https://www.ikea.com/us/en/p/tavelan-tray-set-of-2-bamboo-50465191/": {
                    "image": "https://www.ikea.com/us/en/images/products/tavelan-tray-set-of-2-bamboo__0710185_pe727339_s5.jpg",
                    "description": "TAVELAN Tray set of 2, bamboo. Beautiful natural bamboo tray set."
                  },
                  "https://www.ikea.com/us/en/p/noedmast-led-portable-lamp-battery-operated-white-black-50582576/#content": {
                    "image": "https://www.ikea.com/us/en/images/products/noedmast-led-portable-lamp-battery-operated-white-black__1300301_pe937090_s5.jpg",
                    "description": "N\u00d6DMAST LED portable lamp. Emits a soft light that creates a cozy and inviting atmosphere."
                  },
                  "https://www.walmart.com/ip/Mainstays-3-Bag-Mesh-Rolling-Sorter-Laundry-Cart-Soft-Silver/687612057?wmlspartner=wlpa&selectedSellerId=0&wl13=576&adid=22222222297687612057_0000000000_22264615354&wl0=&wl1=x&wl2=c&wl3=&wl4=&wl5=9026555&wl6=&wl7=&wl8=&wl9=pla&wl10=8175035&wl11=local&wl12=687612057&veh=sem&gclsrc=aw.ds&gad_source=1&gad_campaignid=22264616125&gbraid=0AAAAADmfBIpnJ_W9-HZEXfp0Um9yq8DSc&gclid=CjwKCAjwhe3OBhABEiwA6392zNvyiki2aiGDhFhb9USJK2jhB4OromQmQTlYC9Br6rNhVQL4-I_54hoCV64QAvD_BwE": {
                    "image": "https://i5.walmartimages.com/seo/Mainstays-Soft-Silver-3-Bag-Mesh-Rolling-Laundry-Sorter-Cart_dccaf6bf-ec48-47d4-9b18-9f2ecf970e19.6e0c5b5786f0596674d58bb67a075152.jpeg",
                    "description": "Rolling Laundry Sorter Cart with Removable Mesh Bags and Casters."
                  },
                  "https://www.ikea.com/us/en/p/bolloesund-drawer-organizers-set-of-4-beige-20570886/": {
                    "image": "https://www.ikea.com/us/en/images/products/bolloesund-drawer-organizers-set-of-4-beige__1218055_pe913132_s5.jpg",
                    "description": "BOLL\u00d6SUND drawer organizers, set of 4. Organize your things and utilize every inch in drawers."
                  },
                  "https://www.ikea.com/us/en/p/visslaan-box-with-compartments-gray-00562104/": {
                    "image": "https://www.ikea.com/us/en/images/products/visslaan-box-with-compartments-gray__1499232_pe1006528_s5.jpg",
                    "description": "VISSLA\u00c5N box with compartments. Ideal for storing smaller items so that they\u2019re easy to find."
                  },
                  "https://www.ikea.com/us/en/p/visslaan-box-with-lid-set-of-5-gray-90554538/": {
                    "image": "https://www.ikea.com/us/en/images/products/visslaan-box-with-lid-set-of-5-gray__1499230_pe1006529_s5.jpg",
                    "description": "VISSLA\u00c5N lid boxes, set of 5. Sizes: (1) 8x8x3\u00bd\", (1) 8x4x3\u00bd\", (3) 4x4x3\u00bd\"."
                  },
                  "https://www.athome.com/potted-areca-palm-plant-6/124351622.html": {
                    "image": "https://static.athome.com/images/w_800,h_800,c_pad,f_auto,fl_lossy,q_auto/v1734355251/p/124351622/potted-areca-palm-plant-6.jpg",
                    "description": "72in Potted Areca Palm Plant. Add a touch of tropical elegance to your home or office."
                  },
                  "https://www.wayfair.com/kitchen-tabletop/pdp/kitchenaid-classic-series-45-quart-tilt-head-stand-mixer-kad1445.html?piid=33371416": {
                    "image": "images/stock_kitchenaid.jpeg",
                    "description": "KitchenAid Classic Series 4.5 Quart Tilt-Head Stand Mixer, Silver. Dimensions: 13.9\"H x 8.7\"W x 14.1\"D."
                  },
                  "https://www.amazon.com/Ninja-Grounds-Single-Serve-Coffee-Maker/dp/B0F9LKMSZM?th=1": {
                    "description": "Ninja Pods & Grounds Single-Serve Coffee Maker. Dimensions: 13.31\"H x 5.31\"W x 13.07\"D."
                  },
                  "https://us.amazon.com/Niche-Student-Desk-Shell-Latte/dp/B08QTWCQDC": {
                    "description": "Niche Lux Series Student Desk Shell, Bamboo Latte Finish. Dimensions: 29\"H x 35\"W x 23\"D."
                  }
                };

                // Robust CSV parsing to handle commas inside quotes
                const parseCSV = (text) => {
                    const rows = [];
                    let currentRow = [];
                    let currentCell = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < text.length; i++) {
                        const char = text[i];
                        const nextChar = text[i + 1];
                        
                        if (char === '"') {
                            if (inQuotes && nextChar === '"') {
                                currentCell += '"';
                                i++;
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (char === ',' && !inQuotes) {
                            currentRow.push(currentCell.trim());
                            currentCell = '';
                        } else if ((char === '\r' || char === '\n') && !inQuotes) {
                            if (currentRow.length > 0 || currentCell !== '') {
                                currentRow.push(currentCell.trim());
                                rows.push(currentRow);
                                currentRow = [];
                                currentCell = '';
                            }
                            if (char === '\r' && nextChar === '\n') i++;
                        } else {
                            currentCell += char;
                        }
                    }
                    if (currentRow.length > 0 || currentCell !== '') {
                        currentRow.push(currentCell.trim());
                        rows.push(currentRow);
                    }
                    return rows;
                };

                const allRows = parseCSV(data);
                const dataRows = allRows.slice(1); // Skip header row
                
                inventory = dataRows.map((cols, index) => {
                    let name = cols[0];
                    if (!name) return null;
                    
                    let subname = cols[1];
                    let price = parseFloat((cols[2] || '0').replace(/[^0-9.]/g, '')) || 0;
                    let condition = cols[3]?.trim() || 'N/A';
                    let originalPrice = cols[4] || 'N/A';
                    let status = cols[5]?.trim() || 'Available';
                    let size = cols[6] || 'N/A';
                    let dimensions = cols[7] || '';
                    let height = cols[8] || '';
                    let qty = cols[9] || '1';
                    let rawLink = (cols[10] || '#').trim();

                    // Dynamically scan for images to handle random placement in columns
                    let allImages = [];
                    for (let i = 11; i < cols.length; i++) {
                        let c = cols[i]?.trim();
                        if (c && c !== '#' && !c.match(/^\d{7,15}$/)) { 
                            allImages.push(c);
                        }
                    }

                    let scraped = scrapedData[rawLink] || {};
                    let desc = scraped.description || "Premium garage sale item perfectly kept in a pet-free, smoke-free home.";

                    let finalImages = [];
                    if (scraped.image) finalImages.push(scraped.image);
                    allImages.forEach(img => {
                       if (img && img !== '#') {
                          if (img.startsWith('http')) finalImages.push(img);
                          else finalImages.push('images/' + img);
                       }
                    });
                    
                    let rawImg1 = finalImages[0];
                    let rawImg2 = finalImages[1];
                    let rawImg3 = finalImages[2];

                    if (!rawImg1) rawImg1 = 'https://placehold.co/600x600/111/444?text=Item';

                    // Map HEIC/PNG dynamically
                    rawImg1 = rawImg1.replace(/\.(HEIC|HEIF|PNG|png)$/i, '.jpeg');
                    if (rawImg2) rawImg2 = rawImg2.replace(/\.(HEIC|HEIF|PNG|png)$/i, '.jpeg');
                    if (rawImg3) rawImg3 = rawImg3.replace(/\.(HEIC|HEIF|PNG|png)$/i, '.jpeg');
                    
                    let galleryHtml = `<img src="${rawImg1}" alt="${name}" class="item-img" onerror="this.onerror=null; this.src='https://placehold.co/600x600/111/444?text=Item'">`;
                    if (rawImg2) {
                        let addt = `<img src="${rawImg2}" alt="${name}" class="item-img" style="border-radius: 0; margin-top:2px;" onerror="this.style.display='none'">`;
                        if (rawImg3) addt += `<img src="${rawImg3}" alt="${name}" class="item-img" style="border-radius: 0; margin-top:2px;" onerror="this.style.display='none'">`;
                        galleryHtml = `
                        <div style="display:flex; flex-direction:column;">
                            <img src="${rawImg1}" alt="${name}" class="item-img" style="border-radius: 12px 12px 0 0;" onerror="this.style.display='none'">
                            ${addt}
                        </div>`;
                    }

                    let fullName = subname && subname !== 'N/A' && subname !== '' ? `${name} - ${subname}` : name;
                    let finalOriginal = originalPrice.startsWith('$') ? originalPrice : '$' + originalPrice;
                    if(originalPrice === 'N/A' || originalPrice === '') finalOriginal = 'N/A';
                    
                    
                    let inferredCategory = inferCategory(fullName, desc);
                    let retailer = inferRetailer(rawLink);
                    
                    return {
                        id: `item-${index}`,
                        name: fullName,
                        category: inferredCategory,
                        retailer: retailer,
                        price: price,
                        status: status,
                        size: size,
                        dimensions: dimensions,
                        height: height,
                        qty: qty,
                        originalPrice: finalOriginal,
                        link: rawLink,
                        desc: desc,
                        condition: condition,
                        galleryHtml: galleryHtml,
                        rawImg1: rawImg1
                    };

                }).filter(item => item !== null && item.name !== 'Unknown Item' && item.name !== '');

                renderInventory();
            } catch (err) {
                console.error("Fetch failed", err);
                document.getElementById('inventory-container').innerHTML = '<p>Offline. Check spreadsheet publishing.</p>';
            }
        }

        
        function renderInventory() {
            searchQuery = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = inventory.filter(item => {
                const text = `${item.name} ${item.category} ${item.condition} ${item.desc}`.toLowerCase();
                const matchesSearch = text.includes(searchQuery);
                const matchesCategory = (selectedCategory === "All" || item.category === selectedCategory);
                const matchesSavedTab = !isSavedTab || savedItemIds.includes(item.id);
                const matchesRetailer = selectedRetailer === "All" || item.retailer === selectedRetailer;
                return matchesSearch && matchesCategory && matchesSavedTab && matchesRetailer;
            });
            
            if (priceSort === 'asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (priceSort === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            }

            // Update filters count
            let activeFilters = 0;
            if (searchQuery !== "") activeFilters++;
            if (selectedCategory !== "All") activeFilters++;
            if (selectedRetailer !== "All") activeFilters++;
            
            let filterBtn = document.getElementById('filter-btn');
            document.getElementById('filter-text').innerText = activeFilters > 0 ? `Filtered (${activeFilters})` : 'Filtered (0)';
            filterBtn.classList.toggle('active', activeFilters > 0);
            
            let clearBtn = document.getElementById('clear-btn');
            if (clearBtn) {
                clearBtn.style.display = activeFilters > 0 ? 'flex' : 'none';
            }
            
            const container = document.getElementById('inventory-container');
            const emptyState = document.getElementById('saved-empty-state');
            
            if (isSavedTab && filtered.length === 0) {
                container.style.display = 'none';
                emptyState.classList.remove('force-hide');
            } else {
                container.style.display = 'grid';
                emptyState.classList.add('force-hide');
                
                if (filtered.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 3rem;">No items found matching your filters.</div>';
                    return;
                }
            }

            container.innerHTML = filtered.map((item, index) => {
                const isExpanded = expandedItemId === item.id;
                const isSaved = savedItemIds.includes(item.id);
                
                return `
                <div class="item-card ${isExpanded ? 'expanded' : ''}" style="animation-delay: ${index * 0.05}s">
                    <div class="card-image-wrap" onclick="toggleItem('${item.id}')">
                        <img src="${item.rawImg1}" alt="${item.name}" class="item-img" onerror="this.onerror=null; this.src='https://placehold.co/600x600/111/444?text=Item'">
                    </div>
                    
                    <div class="card-content">
                        <div class="card-header" onclick="toggleItem('${item.id}')">
                            <div class="card-header-left">
                                <span class="item-category">${item.category}</span>
                                <h3 class="item-title">${item.name}</h3>
                                <span class="condition-badge">${item.condition}</span>
                            </div>
                        </div>

                        <div class="card-price-row">
                            <div class="price-container" style="display:flex; align-items:baseline; gap:0.5rem;">
                                <span class="item-price" style="font-size: 1.5rem;">$${item.price.toFixed(2)}</span>
                                ${item.originalPrice !== 'N/A' ? `<span style="text-decoration:line-through; color:var(--text-secondary); font-size:0.9rem;">${item.originalPrice}</span>` : ''}
                            </div>
                            <div class="card-actions">
                                <button class="action-btn ${isSaved ? 'saved' : ''}" onclick="toggleSaved('${item.id}', event)">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="${isSaved ? 'var(--accent-color)' : 'none'}" stroke="${isSaved ? 'var(--accent-color)' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                </button>
                                <button class="action-btn" onclick="toggleItem('${item.id}')">
                                    ${isExpanded ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 4 9 9 4 9"></polyline>
                                        <line x1="9" y1="9" x2="3" y2="3"></line>
                                        <polyline points="15 4 15 9 20 9"></polyline>
                                        <line x1="15" y1="9" x2="21" y2="3"></line>
                                        <polyline points="20 15 15 15 15 20"></polyline>
                                        <line x1="15" y1="15" x2="21" y2="21"></line>
                                        <polyline points="4 15 9 15 9 20"></polyline>
                                        <line x1="9" y1="15" x2="3" y2="21"></line>
                                    </svg>` : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 8 3 3 8 3"></polyline>
                                        <line x1="3" y1="3" x2="9" y2="9"></line>
                                        <polyline points="16 3 21 3 21 8"></polyline>
                                        <line x1="21" y1="3" x2="15" y2="9"></line>
                                        <polyline points="21 16 21 21 16 21"></polyline>
                                        <line x1="21" y1="21" x2="15" y2="15"></line>
                                        <polyline points="8 21 3 21 3 16"></polyline>
                                        <line x1="3" y1="21" x2="9" y2="15"></line>
                                    </svg>`}
                                </button>
                            </div>
                        </div>
                        
                        ${isExpanded ? `
                        <div class="card-expanded-content">
                            <p class="item-desc">${item.desc}</p>
                            
                            <div class="specs-grid">
                                ${(() => {
                                    let specs = [];
                                    
                                    specs.push(`
                                        <div class="spec-box">
                                            <label>DIMENSIONS</label>
                                            <span>${item.dimensions && item.dimensions !== 'N/A' ? item.dimensions : (item.size !== 'N/A' ? item.size : 'Standard')}</span>
                                        </div>
                                    `);
                                    
                                    if (item.originalPrice !== 'N/A') {
                                        let orig = parseFloat(item.originalPrice.replace(/[^0-9.]/g, ''));
                                        if (orig > item.price && orig > 0) {
                                            let percent = Math.round((1 - (item.price / orig)) * 100);
                                            specs.push(`
                                            <div class="spec-box" style="background: rgba(0, 214, 50, 0.05); border-color: rgba(0, 214, 50, 0.2);">
                                                <label style="color: #00D632;">SAVINGS</label>
                                                <span style="color: #00D632; font-weight: 700;">${percent}% OFF Retail</span>
                                            </div>`);
                                        }
                                    }
                                    
                                    if (item.link !== '#') {
                                        let domainStr = 'google.com';
                                        let domainLabel = 'Retailer';
                                        if (item.retailer !== 'Other') {
                                            domainLabel = item.retailer;
                                            for (const [domain, name] of Object.entries(retailerDomains)) {
                                                if (name === item.retailer) {
                                                    domainStr = domain;
                                                    break;
                                                }
                                            }
                                        } else {
                                            try { domainStr = new URL(item.link).hostname; } catch(e) {}
                                        }
                                        
                                        specs.push(`
                                        <div class="spec-box" style="cursor:pointer; background: rgba(59, 130, 246, 0.05); border-color: rgba(59, 130, 246, 0.2);" onclick="window.open('${item.link}', '_blank')">
                                            <label style="color: var(--accent-color);">COMPARE AT</label>
                                            <div style="display:flex; align-items:center; gap:0.5rem; margin-top:0.25rem;">
                                                <img src="https://www.google.com/s2/favicons?domain=${domainStr}&sz=64" style="width:16px; height:16px; border-radius:4px;">
                                                <span style="color:var(--accent-color); font-size:0.9rem; font-weight:600;">${domainLabel} ↗</span>
                                            </div>
                                        </div>`);
                                    }
                                    
                                    specs.push(`
                                        <div class="spec-box">
                                            <label>STATUS</label>
                                            <span style="color: ${item.status === 'Available' ? '#00D632' : '#ff4444'}">● ${item.status}</span>
                                        </div>
                                    `);
                                    
                                    return specs.join('');
                                })()}
                            </div>
                            <div class="expanded-buttons">
                                <button class="btn-primary" onclick="openBuyModal('${item.id}')" ${item.status !== 'Available' ? 'disabled' : ''}>
                                    Buy now
                                </button>
                                <button class="btn-secondary" onclick="window.open('sms:918-555-5555?body=Hi%2C%20I%20have%20a%20question%20about%20the%20${encodeURIComponent(item.name)}')">
                                    Message seller
                                </button>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                </div>
                `;
            }).join('');
        }
function toggleFaq() {
            document.getElementById('faq-details').classList.toggle('force-hide');
        }

        function openBuyModal(id) {
            selectedItem = inventory.find(i => i.id === id);
            if (!selectedItem) return;
            
            const modal = document.getElementById('buy-modal');
            document.getElementById('modal-item-name').innerText = selectedItem.name;
            document.getElementById('modal-stage-1').classList.remove('force-hide');
            document.getElementById('modal-stage-2').classList.add('force-hide');
            const stage3 = document.getElementById('modal-stage-3');
            if(stage3) stage3.classList.add('force-hide');
            
            modal.classList.remove('force-hide');
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('buy-modal');
            modal.classList.add('force-hide');
            modal.style.display = 'none';
            selectedItem = null;
            document.getElementById('buyer-phone').value = '';
            document.getElementById('phone-error').style.display = "none";
            document.getElementById('buyer-phone').style.border = "1px solid var(--glass-border)";
        }

        function goToStage2() {
            const phoneInput = document.getElementById('buyer-phone');
            const errorMsg = document.getElementById('phone-error');
            const phone = phoneInput.value.trim();

            if (!phone) {
                phoneInput.style.border = "2px solid #ff4444";
                errorMsg.style.display = "block";
                return;
            }
            phoneInput.style.border = "1px solid var(--glass-border)";
            errorMsg.style.display = "none";

            document.getElementById('modal-stage-1').classList.add('force-hide');
            document.getElementById('modal-stage-2').classList.remove('force-hide');
        }

        function processPayment(method) {
            if (!selectedItem) {
                closeModal();
                return;
            }

            const phone = document.getElementById('buyer-phone').value.trim();
            const note = encodeURIComponent(`Spring Clean: ${selectedItem.name} - ${phone}`);
            
            // Instantly send an email backup to Zain so he always has their phone number
            fetch("https://formsubmit.co/ajax/zain@thekhanstruct.com", {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    _subject: `New Spring Clean Order: ${selectedItem.name}`,
                    Item: selectedItem.name,
                    Buyer_Phone: phone,
                    Payment_Method: method,
                    _captcha: "false",
                    _template: "table"
                })
            }).catch(e => console.log(e));
            
            // Switch Modal UI Stages
            document.getElementById('modal-stage-2').classList.add('force-hide');
            document.getElementById('modal-stage-3').classList.remove('force-hide');
            
            const instructionBox = document.getElementById('instruction-content');

            if (method === 'venmo') {
                const venmoUrl = `https://venmo.com/u/Zainer23?txn=pay&amount=${selectedItem.price}&note=${note}`;
                instructionBox.innerHTML = `
                    <div class="instruction-step"><div class="step-num">1</div><div>We are redirecting you to Venmo...</div></div>
                    <div class="instruction-step"><div class="step-num">2</div><div>Pay <b>$${selectedItem.price}</b> to <b>@Zainer23</b>.</div></div>
                    <div class="instruction-step" style="margin-top:1rem; font-size:0.85rem;"><a href="${venmoUrl}" target="_blank" style="color:#008CFF">Click here if Venmo didn't open automatically</a></div>
                `;
                setTimeout(() => { window.open(venmoUrl, '_blank'); }, 500);
            } else if (method === 'cashapp') {
                const cashappUrl = `https://cash.app/$z23k/${selectedItem.price}`;
                instructionBox.innerHTML = `
                    <div class="instruction-step"><div class="step-num">1</div><div>We are redirecting you to Cash App...</div></div>
                    <div class="instruction-step"><div class="step-num">2</div><div>Pay <b>$${selectedItem.price}</b> to <b>$z23k</b>.</div></div>
                    <div class="instruction-step"><div class="step-num">3</div><div><b style="color:#00D632">IMPORTANT:</b> Type your phone number (<b>${phone}</b>) in the 'For' note!</div></div>
                    <div class="instruction-step" style="margin-top:1rem; font-size:0.85rem;"><a href="${cashappUrl}" target="_blank" style="color:#00D632">Click here if Cash App didn't open automatically</a></div>
                `;
                setTimeout(() => { window.open(cashappUrl, '_blank'); }, 500);
            } else if (method === 'zelle') {
                instructionBox.innerHTML = `
                    <div style="text-align:center; margin-bottom: 1.5rem;"><img src="images/zelle.svg" style="height:24px; filter: brightness(0) invert(1);"></div>
                    <div class="instruction-step"><div class="step-num">1</div><div>Open your bank's app and navigate to Zelle.</div></div>
                    <div class="instruction-step"><div class="step-num">2</div><div>Send <b>$${selectedItem.price}</b> to <b>ZAIN KHAN</b>.</div></div>
                    <div class="instruction-step"><div class="step-num">3</div><div><b style="color:#a855f7">IMPORTANT:</b> Type your phone number (<b>${phone}</b>) in the Zelle memo!</div></div>
                `;
            }
        }

        fetchInventory();
    

</script>
</body>
</html>
