<html lang="en">
<head>

    <style>
/* EMBEDDED MARKETPLACE STYLES - ZERO CACHE LAG */
/* Premium Marketplace Dark Theme */
:root {
    --bg-color: #f0f2f5;
    --sidebar-bg: #ffffff;
    --card-bg: #ffffff;
    --accent-color: #1877f2; /* FB Blue */
    --accent-hover: #166fe5;
    --text-primary: #050505;
    --text-secondary: #65676b;
    --border-color: #e4e6eb;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}

body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    overflow-x: hidden;
}

/* Layout */

.marketplace-layout {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border-color);
    background: var(--sidebar-bg);
}

.app-header .logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.25rem;
    font-weight: 700;
}

.main-content {
    flex: 1;
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
}

.controls-row {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
}

.search-input-wrapper {
    flex: 1;
    min-width: 250px;
    position: relative;
    display: flex;
    align-items: center;
}

.search-icon {
    position: absolute;
    left: 1rem;
    color: var(--text-secondary);
}

.search-input-wrapper input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 3rem;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--sidebar-bg);
    color: var(--text-primary);
    font-size: 0.95rem;
}

.search-input-wrapper input:focus {
    border-color: var(--accent-color);
    outline: none;
}

.search-actions {
    display: flex;
    gap: 0.5rem;
}

.btn-secondary {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: transparent;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    cursor: pointer;
    font-size: 0.9rem;
    transition: 0.2s;
}

.btn-secondary:hover {
    border-color: var(--text-secondary);
    background: var(--sidebar-bg);
}

.btn-secondary.active {
    border-color: var(--accent-color);
    color: var(--accent-color);
    background: rgba(59, 130, 246, 0.1);
}

/* Category Chips */
.category-chips {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    overflow-x: auto;
    padding-bottom: 0.5rem; /* For scrollbar */
}

.chip {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    background: var(--sidebar-bg);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: 0.2s;
}

.chip:hover {
    border-color: var(--text-secondary);
    color: var(--text-primary);
}

.chip.active {
    background: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
}

/* Retailer Logos Row */
.retailer-row {
    display: flex;
    align-items: center;
    margin-bottom: 2rem;
    overflow-x: auto;
}

.retailer-logos {
    display: flex;
    gap: 0.75rem;
}

.retailer-logo-btn {
    background: var(--sidebar-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    height: 38px;
    padding: 5px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: 0.2s;
}



.retailer-logo-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.retailer-logo-btn:hover {
    border-color: var(--text-secondary);
    transform: translateY(-1px);
}

.retailer-logo-btn.active {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
    background: rgba(59, 130, 246, 0.12);
}

/* Grid & Cards */
.inventory-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
}

.item-card {
    background-color: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--border-color);
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
}

.item-card.expanded {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 1px var(--accent-color);
}

.card-image-wrap {
    width: 100%;
    height: 230px;
    cursor: pointer;
    background-color: #111;
    position: relative;
    overflow: hidden;
}

.item-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.card-image-wrap:hover .item-img {
    transform: scale(1.03);
}

.card-badge-discount {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #10b981;
    color: #ffffff;
    font-size: 0.75rem;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 6px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);
    z-index: 2;
}

.card-badge-qty {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    color: #94a3b8;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 2;
}

.card-content {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.card-header {
    cursor: pointer;
}

.card-header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.25rem;
}

.item-category {
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
}

.item-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0.25rem 0;
    line-height: 1.35;
    color: var(--text-primary);
}

.item-specs-preview {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: 0.25rem;
}

.condition-badge {
    display: inline-block;
    background-color: #21262d;
    color: #8b949e;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    border: 1px solid var(--border-color);
}

.card-pricing-block {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 0.25rem;
}

.price-main-wrap {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
}

.price-current {
    font-size: 1.75rem;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.5px;
}

.price-original {
    font-size: 1.05rem;
    color: #6e7681;
    text-decoration: line-through;
    font-weight: 500;
}

.savings-pill {
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #10b981;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
}

/* Retailer Compare Row */
.retailer-compare-row {
    margin: 0.25rem 0;
}

.retailer-compare-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    width: 100%;
    padding: 0.45rem 0.75rem;
    background: rgba(22, 27, 34, 0.9);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    text-decoration: none;
    color: var(--text-secondary);
    transition: all 0.2s ease;
    box-sizing: border-box;
}

.retailer-compare-btn:hover {
    background: rgba(56, 139, 253, 0.1);
    border-color: var(--accent-color);
    color: var(--text-primary);
}

.compare-text {
    font-size: 0.78rem;
    font-weight: 600;
    color: #8b949e;
}

.compare-logo-wrap {
    display: flex;
    align-items: center;
    height: 20px;
}



.compare-arrow {
    color: var(--accent-color);
    transition: transform 0.2s;
}

.retailer-compare-btn:hover .compare-arrow {
    transform: translate(2px, -2px);
}

.card-actions-row {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.25rem;
}

.btn-card-save, .btn-card-expand {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.55rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-primary);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.btn-card-save:hover, .btn-card-expand:hover {
    background: var(--sidebar-bg);
    border-color: var(--text-secondary);
}

.btn-card-save.saved {
    background: rgba(239, 68, 68, 0.12);
    border-color: #ef4444;
    color: #ef4444;
}

/* Expanded Content */
.card-expanded-content {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border-color);
    animation: fadeIn 0.3s ease;
}

.item-desc {
    font-size: 0.9rem;
    color: #c9d1d9;
    line-height: 1.5;
    margin-bottom: 1.5rem;
}

.specs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.spec-box {
    background-color: #111;
    padding: 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border-color);
}

.spec-box label {
    display: block;
    font-size: 0.65rem;
    color: var(--text-secondary);
    margin-bottom: 0.25rem;
    letter-spacing: 0.5px;
}

.spec-box span {
    font-size: 0.85rem;
    font-weight: 600;
}

.expanded-buttons {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.btn-primary, .btn-secondary {
    width: 100%;
    padding: 0.75rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    border: none;
}

.btn-primary {
    background-color: var(--accent-color);
    color: white;
}

.btn-primary:hover {
    background-color: var(--accent-hover);
}

.btn-primary:disabled {
    background-color: #30363d;
    color: #8b949e;
    cursor: not-allowed;
}

.btn-secondary {
    background-color: var(--sidebar-bg);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
}

.btn-secondary:hover {
    background-color: #2d333b;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Modal styling kept mostly intact but adapted to dark theme */
.modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}
.force-hide { display: none !important; }

.modal-content {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 2rem;
    border-radius: 16px;
    width: 90%;
    max-width: 400px;
    text-align: center;
}

.input-group input {
    width: 100%;
    padding: 1rem;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--bg-color);
    color: white;
    font-size: 1rem;
}
.pay-btn {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 0.5rem;
}
.btn-venmo { background: #008CFF; color: white; }
.btn-cashapp { background: #00D632; color: white; }
.btn-zelle { background: #74189B; color: white; }
.pay-icon { height: 20px; }


/* Mobile Responsiveness Fixes */

@media (max-width: 768px) {
    .app-header {
        padding: 1rem;
    }
    .main-content {
        padding: 1rem;
    }
    .inventory-grid {
        grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
    }
}


.retailer-logo-btn svg,
.compare-logo-wrap svg {
    height: 20px !important;
    max-height: 20px !important;
    width: auto !important;
    max-width: 80px !important;
    display: block !important;
    object-fit: contain !important;
}

                                <span>${isSaved ? 'Saved' : 'Save'}</span>
                            </button>

                            <button class="btn-primary" onclick="openBuyModal('${item.id}')" ${item.status !== 'Available' ? 'disabled' : ''} style="flex: 1.3; min-width: 0; display: flex; align-items: center; justify-content: center; height: 38px; padding: 0 0.4rem; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; border: none; background-color: #1877f2; color: white; text-align: center; white-space: nowrap;">
                                ${item.status === 'Available' ? `Buy Now - $${item.price.toFixed(2)}` : 'Item Sold'}
                            </button>

                            <button class="btn-card-expand" onclick="openLightbox('${item.id}', itemPhotoState['${item.id}']?.currentIdx || 0, event)" style="flex: 1.1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 0.25rem; height: 38px; padding: 0 0.4rem; border-radius: 8px; border: 1px solid #e4e6eb; background: #ffffff; color: #050505; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap;">
                                <span>${isExpanded ? 'Hide Details' : 'Expand Details'}</span>
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="${isExpanded ? '18 15 12 9 6 15' : '6 9 12 15 18 9'}"></polyline></svg>
                            </button>
                        </div>

                        ${hasRetailerLink ? `
                        <div class="retailer-compare-row" style="margin: 0.25rem 0;">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="retailer-compare-btn" title="Compare price at ${item.retailer}" style="display: flex; align-items: center; justify-content: space-between; width: 100%; height: 42px; padding: 0 12px; background: #f7f8fa; border: 1px solid #e4e6eb; border-radius: 8px; text-decoration: none; box-sizing: border-box;">
                                <span class="compare-text" style="font-size: 0.82rem; font-weight: 600; color: #050505;">Compare Price</span>
                                <div class="compare-logo-wrap" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; padding: 2px 10px; background: #ffffff; border: 1px solid #e4e6eb; border-radius: 6px; flex-shrink: 0;">${getRetailerLogoSvg(item.retailer)}</div>
                                <svg class="compare-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M7 17l9.2-9.2M17 17V8H8"/></svg>
                            </a>
                        </div>` : ''}

                        ${isExpanded ? `
                        <div class="card-expanded-content" style="margin-top: 0.5rem; padding-top: 0.75rem; border-top: 1px solid #e4e6eb; display: flex; flex-direction: column; gap: 0.75rem;">
                            <p class="item-desc" style="font-size: 0.85rem; color: #65676b; line-height: 1.5; margin: 0;">${item.desc}</p>
                            
                            <div class="specs-grid" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
                                <div class="spec-box" style="background-color: #f7f8fa; padding: 0.65rem; border-radius: 8px; border: 1px solid #e4e6eb;">
                                    <label style="display: block; font-size: 0.65rem; color: #65676b; margin-bottom: 0.2rem; letter-spacing: 0.5px;">DIMENSIONS</label>
                                    <span style="font-size: 0.82rem; font-weight: 600; color: #050505;">${item.dimensions && item.dimensions !== 'N/A' ? item.dimensions : (item.size && item.size !== 'N/A' ? item.size : 'Standard')}</span>
                                </div>
                                <div class="spec-box" style="background-color: #f7f8fa; padding: 0.65rem; border-radius: 8px; border: 1px solid #e4e6eb;">
                                    <label style="display: block; font-size: 0.65rem; color: #65676b; margin-bottom: 0.2rem; letter-spacing: 0.5px;">CONDITION</label>
                                    <span style="font-size: 0.82rem; font-weight: 600; color: #050505;">${item.condition}</span>
                                </div>
                                <div class="spec-box" style="background-color: #f7f8fa; padding: 0.65rem; border-radius: 8px; border: 1px solid #e4e6eb;">
                                    <label style="display: block; font-size: 0.65rem; color: #65676b; margin-bottom: 0.2rem; letter-spacing: 0.5px;">STATUS</label>
                                    <span style="font-size: 0.82rem; font-weight: 600; color: ${item.status === 'Available' ? '#31a24c' : '#e41e3f'}">● ${item.status}</span>
                                </div>
                            </div>
                                <div class="spec-box" style="background-color: #f7f8fa; padding: 0.65rem; border-radius: 8px; border: 1px solid #e4e6eb;">
                                    <label style="display: block; font-size: 0.65rem; color: #65676b; margin-bottom: 0.2rem; letter-spacing: 0.5px;">STATUS</label>
                                    <span style="font-size: 0.82rem; font-weight: 600; color: ${item.status === 'Available' ? '#31a24c' : '#e41e3f'}">● ${item.status}</span>
                                </div>
                            </div>
                            
                            <button class="btn-secondary" onclick="window.open('sms:8323821675?body=Hi%2C%20I%20have%20a%20question%20about%20the%20${encodeURIComponent(item.name)}')" style="width: 100%; padding: 0.75rem; border-radius: 8px; font-weight: 600; font-size: 0.92rem; cursor: pointer; background-color: #f0f2f5; color: #050505; border: 1px solid #e4e6eb; display: flex; align-items: center; justify-content: center; text-align: center; margin-top: 0.25rem;">
                                Message Seller
                            </button>
                        </div>
                        ` : ''}
                    </div>
                </div>
                `;
            }).join('');
        }

        function toggleFaq() {
            document.getElementById('faq-details').classList.toggle('force-hide');
        }

        function openBuyModal(id) {
            selectedItem = inventory.find(i => i.id === id);
            if (!selectedItem) return;
            
            const modal = document.getElementById('buy-modal');
            document.getElementById('modal-item-name').innerText = selectedItem.name;
            document.getElementById('modal-stage-1').classList.remove('force-hide');
            document.getElementById('modal-stage-2').classList.add('force-hide');
            const stage3 = document.getElementById('modal-stage-3');
            if(stage3) stage3.classList.add('force-hide');
            
            modal.classList.remove('force-hide');
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('buy-modal');
            modal.classList.add('force-hide');
            modal.style.display = 'none';
            selectedItem = null;
            document.getElementById('buyer-phone').value = '';
            document.getElementById('phone-error').style.display = "none";
            document.getElementById('buyer-phone').style.border = "1px solid var(--glass-border)";
        }

        function goToStage2() {
            const phoneInput = document.getElementById('buyer-phone');
            const errorMsg = document.getElementById('phone-error');
            const phone = phoneInput.value.trim();

            if (!phone) {
                phoneInput.style.border = "2px solid #ff4444";
                errorMsg.style.display = "block";
                return;
            }
            phoneInput.style.border = "1px solid var(--glass-border)";
            errorMsg.style.display = "none";

            document.getElementById('modal-stage-1').classList.add('force-hide');
            document.getElementById('modal-stage-2').classList.remove('force-hide');
        }

        function processPayment(method) {
            if (!selectedItem) {
                closeModal();
                return;
            }

            const phone = document.getElementById('buyer-phone').value.trim();
            const note = encodeURIComponent(`Spring Clean: ${selectedItem.name} - ${phone}`);
            
            // Instantly send an email backup to Zain so he always has their phone number
            fetch("https://formsubmit.co/ajax/zain@thekhanstruct.com", {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    _subject: `New Spring Clean Order: ${selectedItem.name}`,
                    Item: selectedItem.name,
                    Buyer_Phone: phone,
                    Payment_Method: method,
                    _captcha: "false",
                    _template: "table"
                })
            }).catch(e => console.log(e));
            
            // Switch Modal UI Stages
            document.getElementById('modal-stage-2').classList.add('force-hide');
            document.getElementById('modal-stage-3').classList.remove('force-hide');
            
            const instructionBox = document.getElementById('instruction-content');

            if (method === 'venmo') {
                const venmoUrl = `https://venmo.com/u/Zainer23?txn=pay&amount=${selectedItem.price}&note=${note}`;
                instructionBox.innerHTML = `
                    <div class="instruction-step"><div class="step-num">1</div><div>We are redirecting you to Venmo...</div></div>
                    <div class="instruction-step"><div class="step-num">2</div><div>Pay <b>$${selectedItem.price}</b> to <b>@Zainer23</b>.</div></div>
                    <div class="instruction-step" style="margin-top:1rem; font-size:0.85rem;"><a href="${venmoUrl}" target="_blank" style="color:#008CFF">Click here if Venmo didn't open automatically</a></div>
                `;
                setTimeout(() => { window.open(venmoUrl, '_blank'); }, 500);
            } else if (method === 'cashapp') {
                const cashappUrl = `https://cash.app/$z23k/${selectedItem.price}`;
                instructionBox.innerHTML = `
                    <div class="instruction-step"><div class="step-num">1</div><div>We are redirecting you to Cash App...</div></div>
                    <div class="instruction-step"><div class="step-num">2</div><div>Pay <b>$${selectedItem.price}</b> to <b>$z23k</b>.</div></div>
                    <div class="instruction-step"><div class="step-num">3</div><div><b style="color:#00D632">IMPORTANT:</b> Type your phone number (<b>${phone}</b>) in the 'For' note!</div></div>
                    <div class="instruction-step" style="margin-top:1rem; font-size:0.85rem;"><a href="${cashappUrl}" target="_blank" style="color:#00D632">Click here if Cash App didn't open automatically</a></div>
                `;
                setTimeout(() => { window.open(cashappUrl, '_blank'); }, 500);
            } else if (method === 'zelle') {
                instructionBox.innerHTML = `
                    <div style="text-align:center; margin-bottom: 1.5rem;"><img src="images/zelle.svg" style="height:24px; filter: brightness(0) invert(1);"></div>
                    <div class="instruction-step"><div class="step-num">1</div><div>Open your bank's app and navigate to Zelle.</div></div>
                    <div class="instruction-step"><div class="step-num">2</div><div>Send <b>$${selectedItem.price}</b> to <b>ZAIN KHAN</b>.</div></div>
                    <div class="instruction-step"><div class="step-num">3</div><div><b style="color:#a855f7">IMPORTANT:</b> Type your phone number (<b>${phone}</b>) in the Zelle memo!</div></div>
                `;
            }
        }

        fetchInventory();
    

</script>

    <!-- Full-Screen Image Lightbox Modal -->
    <div id="lightbox-modal" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px);" onclick="closeLightbox()">
        <button onclick="closeLightbox()" style="position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); border: none; color: #ffffff; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10001;">&times;</button>
        
        <div id="lightbox-counter" style="position: absolute; top: 24px; left: 24px; color: #ffffff; font-size: 0.9rem; font-weight: 600; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 12px; backdrop-filter: blur(4px); z-index: 10001;">1 / 1</div>

        <div id="lightbox-image-container" onclick="event.stopPropagation()" style="position: relative; width: 100%; height: 80vh; max-width: 900px; display: flex; align-items: center; justify-content: center; padding: 20px;">
            <img id="lightbox-img" src="" alt="Product Photo" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); transition: opacity 0.2s ease;">
            
            <button id="lightbox-prev" onclick="prevLightboxImage(event)" title="Previous photo" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.25); border: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10001; backdrop-filter: blur(4px);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button id="lightbox-next" onclick="nextLightboxImage(event)" title="Next photo" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.25); border: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10001; backdrop-filter: blur(4px);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>

        <div onclick="event.stopPropagation()" style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 8px; z-index: 10001;">
            <span id="lightbox-title" style="color: #ffffff; font-size: 1rem; font-weight: 600; text-align: center; max-width: 80vw;"></span>
            <div id="lightbox-dots-wrap" style="display: flex; gap: 8px; align-items: center; background: rgba(0, 0, 0, 0.6); padding: 6px 12px; border-radius: 16px;"></div>
        </div>
    </div>

</body>
</html>
